name: Native v1 candidate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Engine and native Schannel HTTPS checks
        run: dotnet run --project native/Ebira.Checks/Ebira.Checks.csproj -c Release
      - name: Windows layout and adapter selection checks
        run: dotnet run --project native/Ebira.LayoutChecks/Ebira.LayoutChecks.csproj -c Release
      - name: Publish self-contained native Windows app
        run: dotnet publish native/Ebira.Windows/Ebira.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/windows
      - uses: actions/upload-artifact@v4
        with:
          name: Ebira-Windows-unsigned-candidate
          path: dist/windows/Ebira.exe
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install compile platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and lint native Android app
        run: bash android/gradlew -p android assembleDebug lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Ebira-Android-development
          path: android/app/build/outputs/apk/debug/app-debug.apk
