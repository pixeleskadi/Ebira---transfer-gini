name: Preserve Ebira source versions
on:
  push:
    branches: [feature/organize-native-versions]
    paths: [.github/workflows/import-ebira-versions.yml]
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify hashes and publish approved source history with archived CI
        run: python3 ebira-import.py
